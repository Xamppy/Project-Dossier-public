# Project Dossier en un VPS: Caddy (HTTPS) + frontend + API + Postgres + Redis.
# Guía: docs/dev/despliegue-vps.md. Uso: cp .env.example .env && docker compose up -d --build
name: dossier

services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN:?Define DOMAIN en deploy/.env}
      ACME_EMAIL: ${ACME_EMAIL:?Define ACME_EMAIL en deploy/.env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend
      - backend

  frontend:
    build:
      context: ../frontend
      args:
        NEXT_PUBLIC_API_URL: https://${DOMAIN}/api
    restart: unless-stopped
    depends_on:
      - backend

  backend:
    build: ../backend
    restart: unless-stopped
    env_file: .env
    # Estas tienen prioridad sobre .env: la conexión la fija el compose.
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      DATABASE_URL: ""
      DATABASE_AUTO_CREATE_TABLES: "0"
      REDIS_URL: redis://redis:6379/0
      FRONTEND_URL: https://${DOMAIN}
      CORS_ORIGINS: https://${DOMAIN}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Define POSTGRES_DB en deploy/.env}
      POSTGRES_USER: ${POSTGRES_USER:?Define POSTGRES_USER en deploy/.env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD en deploy/.env}
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # Solo caché y bloqueos: sin persistencia y con memoria acotada.
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "128mb", "--maxmemory-policy", "allkeys-lru"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  caddy_data:
  caddy_config:
  pg_data:
