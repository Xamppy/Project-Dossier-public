[pytest]
testpaths = tests
pythonpath = src

# Las categorías se asignan solas por ruta (ver tests/conftest.py):
#   tests/            -> unit
#   tests/integration -> integration
#   tests/stress      -> stress
#   tests/security    -> security
#
#   pytest -m unit                 rápido, en cada guardado
#   pytest -m "not stress"         lo que corre en cada PR
#   pytest -m stress               carga y volumen, más lento
markers =
    unit: prueba unitaria, sin entrada/salida real, milisegundos
    integration: cruza capas o toca base de datos, red simulada
    stress: carga, volumen o concurrencia; puede tardar
    security: control de acceso, aislamiento, tasa, retención
    slow: tarda más de cinco segundos

filterwarnings =
    ignore::DeprecationWarning

addopts =
    --strict-markers
    --tb=short
    -ra
