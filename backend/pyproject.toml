[project]
name = "dossier"
version = "0.2.0"
requires-python = ">=3.12"

[tool.ruff]
line-length = 110
target-version = "py312"
extend-exclude = [".venv", "data"]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle (errores)
    "F",      # pyflakes
    "I",      # isort (orden de imports)
    "UP",     # pyupgrade (sintaxis moderna)
    "B",      # flake8-bugbear
    "BLE",    # blind-except (captura de Exception genérico)
    "SIM",    # flake8-simplify
    "C4",     # flake8-comprehensions
    "PIE",    # flake8-pie
    "RUF",    # reglas propias de ruff
]
ignore = [
    "B008",   # function-call-in-default-argument: patrón idiomático de FastAPI (Depends(), Query(), ...)
    "E501",   # line-too-long: cosmético, no bloquea significado; se revisa aparte si se adopta un formateador
    "RUF001", # ambiguous-unicode-character-string: guiones/comillas tipográficas intencionales en textos en español
    "RUF002", # idem, en docstrings
    "RUF003", # idem, en comentarios
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["BLE001"]  # las pruebas pueden capturar Exception genérico para asserts de robustez

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
explicit_package_bases = true
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
check_untyped_defs = true
exclude = ["tests/", "\\.venv/"]
